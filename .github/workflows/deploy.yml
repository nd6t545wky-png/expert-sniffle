# Ship the default branch to Cloudflare.
#
# Deploying was a manual `npm run deploy` from someone's laptop, which is why
# work could sit finished, tested and pushed for a week while the live app
# served a build from before any of it. This closes that gap: merge to the
# default branch and it goes out.
#
# Three things make that safe rather than reckless.
#
#   - It will not deploy a build that does not typecheck and pass the suite.
#     The `verify` job runs first and the deploy needs it.
#   - It verifies afterwards. `scripts/verify-deploy.mjs` asks production what
#     commit it is running and compares it to what was just built, which is the
#     difference between "the deploy command exited 0" and "the app is the one
#     you think it is". Production is one Worker and the last deploy wins with
#     no notice — that has already happened once to this project.
#   - It never runs from a pull request, so a fork or an unreviewed branch
#     cannot reach production or the deploy credentials.
#
# `workflow_dispatch` is there so a deploy can be triggered without inventing a
# commit — for a rollback, or after a secret is added.
name: Deploy

on:
  push:
    # The repository's default branch. Update this if that ever changes; a
    # workflow listening on a branch nobody pushes to is a workflow that
    # silently never runs.
    branches: [claude/tulmareee-website-audit-uiqvlg]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: an interrupted
# `wrangler deploy` leaves production in a state nobody chose.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # A missing token otherwise surfaces as a wrangler authentication error
      # halfway through, which reads like a broken deploy rather than a setup
      # step nobody has done yet.
      - name: Check the deploy credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set for this repository."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "The token needs the 'Edit Cloudflare Workers' template, plus D1 and R2"
            echo "read/write if the deploy touches those bindings."
            exit 1
          fi

          # A secret pasted with a trailing newline is stored with it, and
          # wrangler puts the token straight into an Authorization header,
          # where a line break is not a legal character. The first real deploy
          # died on exactly that, and what it printed was
          #
          #   ✘ [ERROR] Headers.set: "***" is an invalid header value.
          #
          # which names neither the secret nor the whitespace, reads like a
          # wrangler bug, and sent the first guess at diagnosing it towards
          # token permissions instead. The deploy step strips the whitespace so
          # this never fails for that reason again; this step says so, because
          # silently fixing a malformed secret and never mentioning it is how
          # the same paste error survives into the next repository.
          #
          # Nothing below prints the token: only how many characters were
          # removed, and whether what is left is the right shape.
          clean="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [ "${#clean}" -eq 0 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is entirely whitespace."
            exit 1
          fi
          if [ "${#clean}" -ne "${#CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN has $(( ${#CLOUDFLARE_API_TOKEN} - ${#clean} )) whitespace character(s) in it — almost certainly a line break picked up when copying. The deploy strips them, but re-saving the secret cleanly will silence this."
          fi
          # A Cloudflare API token is letters, digits, underscores and hyphens.
          # Anything else — a smart quote, a zero-width space, half of a
          # different string — cannot go in a header either, and stripping
          # whitespace will not save it.
          case "$clean" in
            *[!A-Za-z0-9_-]*)
              echo "::error::CLOUDFLARE_API_TOKEN is not a bare Cloudflare API token."
              echo ""
              echo "After removing whitespace it is ${#clean} characters and still contains"
              echo "something outside [A-Za-z0-9_-]. A Cloudflare API token is a single"
              echo "40-character string of letters, digits, underscores and hyphens, with no"
              echo "spaces, quotes, colons or slashes in it."
              echo ""
              echo "So the secret is holding more than the token. The usual causes are pasting"
              echo "the 'Test this token' curl command Cloudflare shows underneath it, pasting"
              echo "the whole token-summary block including its permission lines, or pasting a"
              echo "label such as 'Authorization: Bearer ...' along with the value."
              echo ""
              echo "Fix: create or roll the token, copy ONLY the 40-character value, and"
              echo "re-save the secret under Settings → Secrets and variables → Actions."
              exit 1
              ;;
          esac

          # A well-formed token is exactly 40 characters. A different length is
          # not fatal — Cloudflare has not promised that forever — but it is
          # almost always the wrong string, so say so before spending a deploy
          # finding out from an authentication error.
          if [ "${#clean}" -ne 40 ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is ${#clean} characters; a Cloudflare API token is normally 40. If the deploy fails to authenticate, this is the first thing to check — a 32-character value is usually an Account ID or a Global API Key rather than an API token."
          fi

      # `npm run build` stamps dist/build.json with this commit and a hash of
      # every shipped file. The verify step below reads it back off production.
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only needed when the token can see more than one account; wrangler
          # infers it otherwise, so an unset value is not an error.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Whitespace the paste carried in, removed before it reaches a
          # header. See the credential check above for what this cost once.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy

      # Cloudflare can return success before the new version is serving every
      # edge, so this is given a few attempts before it is called a failure.
      - name: Verify production is running this build
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/verify-deploy.mjs; then
              exit 0
            fi
            echo "Not serving the new build yet (attempt $attempt); waiting 15s."
            sleep 15
          done
          echo "::error::Deploy reported success but production is not serving this build."
          node scripts/verify-deploy.mjs
          exit 1
